<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search Console Verification</title>
    
    <!-- 
    ملف التحقق من Google Search Console
    
    خطوات التفعيل:
    1. اذهب إلى: https://search.google.com/search-console
    2. أضف الموقع: https://alshifaa-pharmacy.onspace.app
    3. اختر طريقة التحقق: "ملف HTML"
    4. انسخ محتوى الملف الذي يعطيك إياه Google
    5. استبدل محتوى هذا الملف بالمحتوى الجديد
    6. أو أضف meta tag التحقق في index.html
    -->
    
    <meta name="google-site-verification" content="YOUR-VERIFICATION-CODE-HERE" />
</head>
<body>
    <h1>Google Search Console Verification</h1>
    <p>هذا الملف للتحقق من ملكية الموقع على Google Search Console</p>
</body>
</html>
